name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Compile check
        run: python -m compileall -q maksekeskus
      - name: Run tests (sandbox tests skipped unless secrets are set)
        run: python -m pytest -v
        env:
          MAKSEKESKUS_SHOP_ID: ${{ secrets.MAKSEKESKUS_SHOP_ID }}
          MAKSEKESKUS_SECRET_KEY: ${{ secrets.MAKSEKESKUS_SECRET_KEY }}
          MAKSEKESKUS_PUBLISHABLE_KEY: ${{ secrets.MAKSEKESKUS_PUBLISHABLE_KEY }}
